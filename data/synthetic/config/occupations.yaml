      p25: 8500.0
      median: 12500.0
      p75: 18000.0
      p90: 22000.0
      max: 28000.0
    persona_mapping:
      tight_budgeter: 0.35
      discretionary_spender: 0.30
      balanced_spender: 0.15
      consistent_saver: 0.10
      mixed_drifting: 0.10

