# =============================================================================
# Occupation & Segment Models (Bangladesh MFS Users)
# Defines income percentiles in BDT and many-to-many persona mappings.
# =============================================================================

occupations:
  - code: garment_worker
    name: Ready-Made Garment (RMG) Worker
    bangla_name: পোশাক শ্রমিক
    description: Industrial garment factory operator or supervisor receiving monthly salary via MFS.
    income_distribution_bdt:
      min: 12500.0
      p10: 13500.0
      p25: 15000.0
      median: 18500.0
      p75: 23000.0
      p90: 27000.0
      max: 32000.0
    persona_mapping:
      tight_budgeter: 0.50
      cash_dominant_transactor: 0.35
      consistent_saver: 0.10
      mixed_drifting: 0.05

  - code: student
    name: College / University Student
    bangla_name: শিক্ষার্থী
